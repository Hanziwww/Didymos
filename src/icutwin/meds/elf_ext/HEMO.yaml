# CLIF 3.0 invasive_hemodynamics (pressures in mmHg, flows in L/min, per CLIF 3.0 units), as ELF VITAL.
elf_version: "icutwin-ext-0.1.0"
subject_id_col: patient_id

invasive_hemodynamics:
  measurement:
    code: [HEMO, col(measurement_category)]
    time: col(recorded_dttm)
    numeric_value: measurement_value
