# CLIF 3.0 airway: placement and removal of an artificial airway.
elf_version: "icutwin-ext-0.1.0"
subject_id_col: patient_id

airway:
  placed:
    code: [AIRWAY, col(airway_category), placed]
    time: col(placed_dttm)
  removed:
    code: [AIRWAY, col(airway_category), removed]
    time: col(removed_dttm)
