# CLIF 3.0 microbiology_culture: specimen collection (one event per method, specimen and time; culture rows
# repeat it per organism). Collection times drive infection definitions (CDC Adult Sepsis Event).
elf_version: "icutwin-ext-0.1.0"
subject_id_col: patient_id

microbiology_culture:
  collected:
    code: [MICRO_ORDER, col(method_category), col(fluid_category)]
    time: col(collect_dttm)
    distinct: true
