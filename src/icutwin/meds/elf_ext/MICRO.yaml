# CLIF 3.0 microbiology_culture: each organism (or no growth) at the result time; the specimen collection
# itself is MICRO_ORDER (MICRO_ORDER.yaml).
elf_version: "icutwin-ext-0.1.0"
subject_id_col: patient_id

microbiology_culture:
  result:
    code: [MICRO, col(method_category), col(fluid_category), col(organism_category)]
    time: col(result_dttm)
