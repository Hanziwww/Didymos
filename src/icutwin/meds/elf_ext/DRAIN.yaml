# CLIF 3.0 drain: placement and removal of a drain, tube or catheter.
elf_version: "icutwin-ext-0.1.0"
subject_id_col: patient_id

drain:
  placed:
    code: [DRAIN, col(drain_category), placed]
    time: col(placed_dttm)
  removed:
    code: [DRAIN, col(drain_category), removed]
    time: col(removed_dttm)
