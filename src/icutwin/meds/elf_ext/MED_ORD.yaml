# CLIF 3.0 medication_orders (eICU, which records no administered intermittent doses): the ordered dose at
# the order start, in the order's unit as MED_INT carries the administered unit; the order stop. The build
# appends the ordered route (meds/qualifiers.yaml: declared extension column med_route_category).
elf_version: "icutwin-ext-0.1.0"
subject_id_col: patient_id

medication_orders:
  start:
    code: [MED_ORD, col(med_category), col(med_dose_unit), start]
    time: col(order_start_dttm)
    numeric_value: med_dose
  stop:
    code: [MED_ORD, col(med_category), NA, stop]
    time: col(order_end_dttm)
