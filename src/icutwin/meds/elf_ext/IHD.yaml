# CLIF 3.0 intermittent_dialysis: a session event per row (eICU and NWICU record presence only) and the
# recorded flows (CLIF_MEDS CRRT style: settings without a value are not events).
elf_version: "icutwin-ext-0.1.0"
subject_id_col: patient_id

intermittent_dialysis:
  session:
    code: IHD//session
    time: col(recorded_dttm)
  blood_flow_rate:
    code: IHD//blood_flow_rate
    time: col(recorded_dttm)
    numeric_value: blood_flow_rate
    skip_empty: true
  dialysate_flow_rate:
    code: IHD//dialysate_flow_rate
    time: col(recorded_dttm)
    numeric_value: dialysate_flow_rate
    skip_empty: true
  net_ultrafiltration_out:
    code: IHD//net_ultrafiltration_out
    time: col(recorded_dttm)
    numeric_value: net_ultrafiltration_out
    skip_empty: true
