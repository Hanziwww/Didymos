# Category -> group of the CLIF tables generate.clif_out writes: a group column is a function of its category
# column (CLIF's mCIDE; clifpy's 3.0 schemas publish the medication, input and assessment mappings, our adapters
# set the output groups). Collected 2026-10-07 from the full canonical CLIF of the seven datasets
# (tools/server/clif_groups.py: every category has one group); categories without a group are left out.
# table -> {category: <column>, group: <column>, map: {category: group}}
